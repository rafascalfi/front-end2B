<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mural de Projetos • TI_MULTI_SESI_2026WEB</title>
  
  <!-- Fontes & Ícones -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --card-hover-bg: #162032;
      --card-border: #1f2937;
      --card-border-hover: #374151;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --primary: #3b82f6;
      --primary-glow: rgba(59, 130, 246, 0.25);
      --accent: #8b5cf6;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image: 
        radial-gradient(at 15% 15%, rgba(59, 130, 246, 0.08) 0px, transparent 50%),
        radial-gradient(at 85% 85%, rgba(139, 92, 246, 0.08) 0px, transparent 50%);
      background-attachment: fixed;
    }

    .container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4rem;
      width: 100%;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .header-badges {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 1.2rem;
    }

    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #94a3b8;
      padding: 0.4rem 0.9rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      backdrop-filter: blur(8px);
    }

    .badge-pill.highlight {
      background: rgba(59, 130, 246, 0.12);
      border-color: rgba(59, 130, 246, 0.3);
      color: #60a5fa;
    }

    h1 {
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin-bottom: 0.85rem;
      background: linear-gradient(135deg, #ffffff 40%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
      max-width: 650px;
      margin: 0 auto;
      line-height: 1.6;
    }

    /* Stats Cards */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: rgba(17, 24, 39, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 0.85rem;
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      backdrop-filter: blur(10px);
    }

    .stat-icon {
      width: 42px;
      height: 42px;
      border-radius: 0.65rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    .stat-icon.total { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
    .stat-icon.github { background: rgba(255, 255, 255, 0.1); color: #f3f4f6; }
    .stat-icon.netlify { background: rgba(0, 199, 183, 0.15); color: #00c7b7; }
    .stat-icon.classroom { background: rgba(16, 185, 129, 0.15); color: #34d399; }

    .stat-info h3 {
      font-size: 1.4rem;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 0.25rem;
    }

    .stat-info p {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Controls */
    .controls-wrapper {
      background: rgba(17, 24, 39, 0.8);
      border: 1px solid var(--card-border);
      border-radius: 1rem;
      padding: 1rem;
      margin-bottom: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      backdrop-filter: blur(12px);
    }

    @media (min-width: 768px) {
      .controls-wrapper {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
    }

    .search-box {
      position: relative;
      flex: 1;
      max-width: 440px;
    }

    .search-box i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .search-box input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 0.75rem;
      padding: 0.75rem 1rem 0.75rem 2.75rem;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    .filter-tabs {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 0.5rem 0.9rem;
      border-radius: 0.6rem;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
    }

    .tab-btn.active {
      background: rgba(59, 130, 246, 0.15);
      border-color: rgba(59, 130, 246, 0.3);
      color: #60a5fa;
    }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1.5rem;
    }

    /* Project Card */
    .project-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 1.1rem;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .project-card:hover {
      background: var(--card-hover-bg);
      border-color: var(--card-border-hover);
      transform: translateY(-4px);
      box-shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.5);
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .student-avatar {
      width: 48px;
      height: 48px;
      border-radius: 0.85rem;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
      color: #fff;
      flex-shrink: 0;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.25);
    }

    .student-details {
      flex: 1;
      min-width: 0;
    }

    .student-name {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.3;
      margin-bottom: 0.35rem;
    }

    .platform-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
    }

    .platform-github {
      background: rgba(255, 255, 255, 0.08);
      color: #e5e7eb;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .platform-netlify {
      background: rgba(0, 199, 183, 0.1);
      color: #00c7b7;
      border: 1px solid rgba(0, 199, 183, 0.25);
    }

    .platform-classroom {
      background: rgba(16, 185, 129, 0.1);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.25);
    }

    .card-body {
      margin-bottom: 1.5rem;
    }

    .project-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 0.4rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .project-url {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      display: block;
      background: rgba(0, 0, 0, 0.2);
      padding: 0.4rem 0.6rem;
      border-radius: 0.4rem;
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .btn-main {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: var(--primary);
      color: white;
      text-decoration: none;
      padding: 0.75rem 1rem;
      border-radius: 0.65rem;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .btn-main:hover {
      background: #2563eb;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
    }

    .btn-icon {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      width: 42px;
      height: 42px;
      border-radius: 0.65rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s;
    }

    .btn-icon:hover {
      color: #fff;
      border-color: #4b5563;
      background: rgba(255, 255, 255, 0.1);
    }

    /* Modal de Prévia */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(6px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      background: #111827;
      border: 1px solid #374151;
      border-radius: 1rem;
      width: 100%;
      max-width: 1000px;
      height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    .modal-header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid #1f2937;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0f172a;
    }

    .modal-header h4 {
      font-size: 1.1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .modal-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .modal-body {
      flex: 1;
      background: #000;
      position: relative;
    }

    .modal-iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: #10b981;
      color: white;
      padding: 0.85rem 1.25rem;
      border-radius: 0.75rem;
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
      z-index: 2000;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Footer */
    footer {
      margin-top: auto;
      text-align: center;
      padding-top: 3rem;
      color: #64748b;
      font-size: 0.85rem;
    }

    /* Empty state */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 1.5rem;
      background: rgba(17, 24, 39, 0.5);
      border-radius: 1rem;
      border: 1px dashed var(--card-border);
    }

    .empty-state i {
      font-size: 3rem;
      color: #4b5563;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Mural de Projetos da Turma</h1>
      <p class="subtitle">Acesse e explore os websites desenvolvidos e publicados pelos estudantes nesta atividade prática.</p>
    </header>

    <!-- Indicadores / Stats -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-icon total"><i class="fa-solid fa-layer-group"></i></div>
        <div class="stat-info">
          <h3 id="statTotal">8</h3>
          <p>Projetos Entregues</p>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon github"><i class="fa-brands fa-github"></i></div>
        <div class="stat-info">
          <h3 id="statGithub">4</h3>
          <p>GitHub Pages</p>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon netlify"><i class="fa-solid fa-globe"></i></div>
        <div class="stat-info">
          <h3 id="statNetlify">2</h3>
          <p>Netlify Sites</p>
        </div>
      </div>
      <div class="stat-card" id="statClassroomCard">
        <div class="stat-icon classroom" id="statClassroomIconContainer"><i class="fa-solid fa-circle-check" id="statClassroomIcon"></i></div>
        <div class="stat-info">
          <h3 id="statClassroom">100%</h3>
          <p id="statClassroomLabel">Sites Publicados</p>
        </div>
      </div>
    </div>

    <!-- Barra de Busca & Filtros -->
    <div class="controls-wrapper">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Pesquisar por aluno, projeto ou link...">
      </div>
      <div class="filter-tabs">
        <button class="tab-btn active" data-filter="all">Todos (<span id="countAll">8</span>)</button>
        <button class="tab-btn" data-filter="github"><i class="fa-brands fa-github"></i> GitHub (<span id="countGithub">5</span>)</button>
        <button class="tab-btn" data-filter="netlify"><i class="fa-solid fa-bolt"></i> Netlify (<span id="countNetlify">3</span>)</button>
      </div>
    </div>

    <!-- Grid de Projetos -->
    <div class="grid" id="projectsGrid"></div>
  </div>

  <!-- Modal de Pré-visualização -->
  <div class="modal-backdrop" id="previewModal">
    <div class="modal-box">
      <div class="modal-header">
        <h4 id="modalStudentTitle"><i class="fa-solid fa-laptop-code"></i> Prévia do Projeto</h4>
        <div class="modal-actions">
          <a id="modalExternalLink" href="#" target="_blank" class="btn-main" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;">
            <span>Abrir em Nova Aba</span>
            <i class="fa-solid fa-external-link-alt"></i>
          </a>
          <button class="btn-icon" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
        </div>
      </div>
      <div class="modal-body">
        <iframe id="modalIframe" class="modal-iframe" src="about:blank"></iframe>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast">
    <i class="fa-solid fa-circle-check"></i>
    <span id="toastMsg">Link copiado com sucesso!</span>
  </div>

  <script src="data.js"></script>
  <script>
    const grid = document.getElementById('projectsGrid');
    const searchInput = document.getElementById('searchInput');
    const tabButtons = document.querySelectorAll('.tab-btn');
    const previewModal = document.getElementById('previewModal');
    const modalIframe = document.getElementById('modalIframe');
    const modalStudentTitle = document.getElementById('modalStudentTitle');
    const modalExternalLink = document.getElementById('modalExternalLink');
    const toast = document.getElementById('toast');

    let currentFilter = 'all';

    function getPlatform(url) {
      const u = url.toLowerCase();
      if (u.includes('github.io')) {
        return { type: 'github', name: 'GitHub Pages', icon: 'fa-brands fa-github', badgeClass: 'platform-github' };
      }
      if (u.includes('netlify.app')) {
        return { type: 'netlify', name: 'Netlify', icon: 'fa-solid fa-bolt', badgeClass: 'platform-netlify' };
      }
      if (u.includes('classroom.google.com')) {
        return { type: 'classroom', name: 'Anexo Classroom', icon: 'fa-solid fa-paperclip', badgeClass: 'platform-classroom' };
      }
      return { type: 'web', name: 'Web', icon: 'fa-solid fa-globe', badgeClass: 'platform-github' };
    }

    function getInitials(name) {
      if (!name) return '??';
      const clean = name.replace(/[^\w\sÀ-ÿ]/gi, '').trim();
      const parts = clean.split(/\s+/);
      if (parts.length === 1) return parts[0].substring(0, 2).toUpperCase();
      return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
    }

    function updateStats(items) {
      const total = items.length;
      const gh = items.filter(i => getPlatform(i.url).type === 'github').length;
      const netlify = items.filter(i => getPlatform(i.url).type === 'netlify').length;
      const classroom = items.filter(i => getPlatform(i.url).type === 'classroom').length;

      document.getElementById('statTotal').textContent = total;
      document.getElementById('statGithub').textContent = gh;
      document.getElementById('statNetlify').textContent = netlify;
      if (document.getElementById('countAll')) document.getElementById('countAll').textContent = total;
      if (document.getElementById('countGithub')) document.getElementById('countGithub').textContent = gh;
      if (document.getElementById('countNetlify')) document.getElementById('countNetlify').textContent = netlify;

      if (classroom === 0) {
        document.getElementById('statClassroom').textContent = '100%';
        document.getElementById('statClassroomLabel').textContent = 'Sites Publicados';
      } else {
        document.getElementById('statClassroom').textContent = classroom;
        document.getElementById('statClassroomLabel').textContent = 'Anexos no Classroom';
      }
    }

    function renderCards(items) {
      if (items.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <i class="fa-regular fa-folder-open"></i>
            <h3 style="margin-bottom: 0.5rem; font-size: 1.2rem;">Nenhum projeto encontrado</h3>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Tente ajustar a busca ou o filtro selecionado.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = items.map(p => {
        const platform = getPlatform(p.url);
        const initials = getInitials(p.nome);
        const isClassroom = platform.type === 'classroom';

        return `
          <div class="project-card">
            <div>
              <div class="card-header">
                <div class="student-avatar">${initials}</div>
                <div class="student-details">
                  <h3 class="student-name">${p.nome}</h3>
                  <span class="platform-badge ${platform.badgeClass}">
                    <i class="${platform.icon}"></i> ${platform.name}
                  </span>
                </div>
              </div>
              <div class="card-body">
                <div class="project-title">
                  <i class="fa-solid fa-code" style="color: var(--primary); font-size: 0.85rem;"></i>
                  <span>${p.titulo}</span>
                </div>
                <code class="project-url" title="${p.url}">${p.url}</code>
              </div>
            </div>
            <div class="card-actions">
              <a href="${p.url}" target="_blank" rel="noopener noreferrer" class="btn-main">
                <span>${isClassroom ? 'Ver Entrega' : 'Abrir Projeto'}</span>
                <i class="fa-solid fa-arrow-up-right-from-square"></i>
              </a>
              ${!isClassroom ? `
                <button class="btn-icon" onclick="openPreview('${encodeURIComponent(p.nome)}', '${p.url}')" title="Visualizar prévia">
                  <i class="fa-solid fa-eye"></i>
                </button>
              ` : ''}
              <button class="btn-icon" onclick="copyLink('${p.url}')" title="Copiar link">
                <i class="fa-regular fa-copy"></i>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterAndRender() {
      const q = searchInput.value.toLowerCase().trim();
      const list = window.PROJECTS_DATA || [];

      const filtered = list.filter(item => {
        const platform = getPlatform(item.url).type;
        const matchesFilter = (currentFilter === 'all') || (platform === currentFilter);
        const matchesQuery = !q || 
          item.nome.toLowerCase().includes(q) ||
          item.titulo.toLowerCase().includes(q) ||
          item.url.toLowerCase().includes(q);

        return matchesFilter && matchesQuery;
      });

      renderCards(filtered);
    }

    function copyLink(url) {
      navigator.clipboard.writeText(url).then(() => {
        showToast('Link copiado com sucesso!');
      }).catch(() => {
        showToast('Erro ao copiar link.');
      });
    }

    function showToast(msg) {
      document.getElementById('toastMsg').textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function openPreview(nome, url) {
      modalStudentTitle.innerHTML = `<i class="fa-solid fa-laptop-code"></i> ${decodeURIComponent(nome)}`;
      modalExternalLink.href = url;
      modalIframe.src = url;
      previewModal.classList.add('open');
    }

    function closeModal() {
      previewModal.classList.remove('open');
      modalIframe.src = 'about:blank';
    }

    previewModal.addEventListener('click', (e) => {
      if (e.target === previewModal) closeModal();
    });

    searchInput.addEventListener('input', filterAndRender);

    tabButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        tabButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        filterAndRender();
      });
    });

    // Inicialização
    const initialList = window.PROJECTS_DATA || [];
    updateStats(initialList);
    renderCards(initialList);
  </script>
</body>
</html>
